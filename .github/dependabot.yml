version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - "/"
      - "/infra"
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      # esbuild is pre-1.0; every minor is breaking. Keep it isolated
      # so it gets human review and a smoke test before merge.
      dev-zero-x:
        patterns:
          - "esbuild"
        update-types:
          - "minor"
          - "major"
      # Majors (e.g. typescript 7, vitest 5) get their own PRs so one
      # breaking upgrade doesn't block the rest of the group.
      dev:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "esbuild"
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"

  - package-ecosystem: docker
    directory: /runtime/vscode-browser
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /runtime/vscode-tunnel
    schedule:
      interval: weekly
    # Stay on Ubuntu LTS (even-year YY.04). Dependabot sees YY.10 as a
    # semver-minor bump and odd-year YY.04 as a semver-major bump; both are
    # interim releases (9-month support), so ignore them. Even-year majors
    # (26.04, 28.04) still come through as LTS upgrade PRs.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "ubuntu"
        versions:
          - "25.x"
          - "27.x"
          - "29.x"
