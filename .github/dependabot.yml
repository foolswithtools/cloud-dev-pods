version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - "/"
      - "/infra"
    schedule:
      interval: weekly
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      # esbuild is pre-1.0; every minor is breaking. Keep it isolated
      # so it gets human review and a smoke test before merge.
      dev-zero-x:
        patterns:
          - "esbuild"
        update-types:
          - "minor"
          - "major"
      # Majors (e.g. typescript 7, vitest 5) get their own PRs so one
      # breaking upgrade doesn't block the rest of the group.
      dev:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "esbuild"
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"

  - package-ecosystem: docker
    directory: /runtime/vscode-browser
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /runtime/vscode-tunnel
    schedule:
      interval: weekly
    # Stay on Ubuntu LTS (even-year YY.04). Every YY.10 and odd-year YY.04 is
    # an interim release (9-month support), so ignore them. They're listed as
    # exact tags because Dependabot's docker updater doesn't match `25.x`-style
    # wildcards against tags like `25.10` (it logged `25.x` as ignored and
    # still opened 24.04 -> 25.10, #115). Extend the list before 2030.
    # Even-year LTS majors (26.04, 28.04) still come through as upgrade PRs;
    # 26.04 was closed in #51, so that upgrade has to be done by hand.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "ubuntu"
        versions:
          - "24.10"
          - "25.04"
          - "25.10"
          - "26.10"
          - "27.04"
          - "27.10"
          - "28.10"
          - "29.04"
          - "29.10"
