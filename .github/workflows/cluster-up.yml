name: cluster-up
# Provision the cluster + cluster-supporting stacks. Run after bootstrap-aws.
# Uses OIDC against AWS_DEPLOYER_ROLE_ARN.

on:
  workflow_dispatch:

# One shared group for cluster-up, cluster-down, pod-up and pod-down (#225),
# so no pod or cluster workflow can start while a cluster-down is draining
# and destroying (and two cluster-ups can't collide). cancel-in-progress:
# false never cancels a running run. GitHub keeps at most ONE pending run per
# group: a newer dispatch cancels an older one still waiting, so re-dispatch
# anything that shows as cancelled. See "One workflow at a time" in
# docs/operating.md.
concurrency:
  group: cloud-dev-pods-cluster-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.repository != 'foolswithtools/cloud-dev-pods'
    permissions:
      contents: read
    steps:
      - run: echo "Provisioning cluster in fork ${{ github.repository }}."

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stack names come from naming.prefix in config/config.yaml (#225), via
      # the same module the CDK app builds its stacks from.
      - name: Resolve stack names
        id: stacks
        env:
          CDPODS_CONFIG: ${{ github.workspace }}/config/config.yaml
        run: |
          set -euo pipefail
          CLUSTER_STACKS=$(npx tsx scripts/stack-names.ts --cluster)
          CLUSTER_STACK=$(npx tsx scripts/stack-names.ts --cluster-stack)
          if [ -z "$CLUSTER_STACKS" ] || [ -z "$CLUSTER_STACK" ]; then
            echo "::error::scripts/stack-names.ts returned no stack names."
            exit 1
          fi
          echo "Cluster stacks: $CLUSTER_STACKS"
          {
            echo "cluster=$CLUSTER_STACKS"
            echo "cluster_stack=$CLUSTER_STACK"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS via OIDC
        uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pre-flight orphan EFS check
        # Non-blocking: surfaces orphan EFS filesystems left over from a
        # v0.1.x deployment (RemovalPolicy.RETAIN). v0.2.0 defaults to
        # DESTROY (see ADR 0007), so any project-tagged EFS without a
        # live <prefix>-Cluster stack is a leak from the previous
        # version. Use scripts/maintainer/cleanup-orphan-efs.sh to clean
        # them up. NEVER fails the workflow.
        env:
          CLUSTER_STACK: ${{ steps.stacks.outputs.cluster_stack }}
        run: |
          set -uo pipefail
          ORPHAN_COUNT=$(aws efs describe-file-systems \
            --query "FileSystems[?Tags[?Key=='Project' && Value=='cloud-dev-pods']] | length(@)" \
            --output text 2>/dev/null || echo 0)
          if [[ "$ORPHAN_COUNT" =~ ^[0-9]+$ ]] && (( ORPHAN_COUNT > 0 )); then
            if ! aws cloudformation describe-stacks --stack-name "$CLUSTER_STACK" >/dev/null 2>&1; then
              echo "::warning::Found $ORPHAN_COUNT orphan EFS filesystem(s) tagged Project=cloud-dev-pods with no live $CLUSTER_STACK stack. These are likely left over from a v0.1.x deployment that used RemovalPolicy.RETAIN. Run CLUSTER_STACK_NAME=$CLUSTER_STACK scripts/maintainer/cleanup-orphan-efs.sh --mode efs --apply to clean them up. See ADR 0007 + docs/teardown.md."
            fi
          fi

      - name: cdk deploy (Network + Cluster + PodTaskFamily + PodManager + IdleReaper)
        id: deploy
        working-directory: infra
        env:
          CDPODS_CONFIG: ${{ github.workspace }}/config/config.yaml
          CLUSTER_STACKS: ${{ steps.stacks.outputs.cluster }}
        run: |
          set -euo pipefail
          read -ra stacks <<< "$CLUSTER_STACKS"
          npx cdk deploy "${stacks[@]}" \
            --require-approval never \
            --concurrency 4

      - name: Read cluster outputs from SSM
        id: outputs
        run: |
          set -euo pipefail
          ALB_DNS=$(aws ssm get-parameter --name /cloud-dev-pods/dev/cluster/alb-dns --query Parameter.Value --output text)
          PROTO=$(aws ssm get-parameter --name /cloud-dev-pods/dev/cluster/listener-protocol --query Parameter.Value --output text)
          POD_MGR=$(aws ssm get-parameter --name /cloud-dev-pods/dev/pod-manager/function-arn --query Parameter.Value --output text)
          {
            echo "alb_dns=$ALB_DNS"
            echo "proto=$PROTO"
            echo "pod_mgr=$POD_MGR"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## Cluster up"
            echo ""
            echo "- ALB: \`${{ steps.outputs.outputs.alb_dns }}\` (\`${{ steps.outputs.outputs.proto }}\`)"
            echo "- pod-manager: \`${{ steps.outputs.outputs.pod_mgr }}\`"
            echo ""
            echo "**Before pod-up**: ensure the three Secrets Manager secrets exist —"
            echo "\`/cloud-dev-pods/oauth/client-id\`, \`/cloud-dev-pods/oauth/client-secret\`, \`/cloud-dev-pods/oauth/cookie-secret\`."
            echo "If you ran \`npm run init\` they were created; otherwise:"
            echo ""
            echo '```bash'
            echo "aws secretsmanager create-secret --name /cloud-dev-pods/oauth/client-id --secret-string '<github-oauth-app-client-id>'"
            echo "aws secretsmanager create-secret --name /cloud-dev-pods/oauth/client-secret --secret-string '<github-oauth-app-client-secret>'"
            echo "aws secretsmanager create-secret --name /cloud-dev-pods/oauth/cookie-secret --secret-string \"\$(openssl rand -base64 32)\""
            echo '```'
            echo ""
            echo "Next: \`gh workflow run pod-up.yml -f pod_name=hello -f mode=browser\`."
          } >> "$GITHUB_STEP_SUMMARY"
