name: cluster-down
# Tear down the cluster + cluster-supporting stacks. BootstrapStack (OIDC, IAM
# roles, ECR repos) is intentionally NOT destroyed — keep them around so you
# don't have to re-bootstrap if you spin the cluster back up later.
#
# Pre-flight: scripts/cluster-drain.ts (step id `drain`) decides whether
# `cdk destroy` may run. It refuses if any pods are registered, unless
# `force=true` (then it stops each one through the pod-manager Lambda and
# re-lists to confirm none are left). It fails closed: a failed pod list, a
# malformed response, a failed `down`, or a pod still registered after the
# drain all stop the teardown.
#
# Exit 0 alone is not enough: if the script's main() never runs, it still
# exits 0 (#194). So the drain writes the step output `proceed=true` only
# when it decided to proceed. `cdk destroy` runs only when
# `steps.drain.outputs.proceed == 'true'`, and the "Require pre-flight proof"
# step fails the job when the drain exited 0 without writing it (#211).
# See "cluster-down refuses: pod pre-flight failed" in docs/troubleshooting.md.
#
# Stack names are `${naming.prefix}-*`, read from config/config.yaml by
# scripts/stack-names.ts (#225). Before the drain, "Require deployed stacks"
# fails the job if none of them exists in CloudFormation, so a mismatched
# prefix can't drain the pods and then destroy nothing. Stacks a fork adds
# through infra/extensions.local.ts are not in this list; see
# docs/teardown.md.
#
# Workspaces (#227): scripts/cluster-workspace-guard.ts (step id
# `workspace_guard`) runs before the drain. When the deployed EFS removal
# policy is DESTROY (efs.retainOnClusterDown: false, ADR 0007) and the file
# system still has access points (pod workspaces), it refuses unless
# `delete_workspaces=true`. It finds workspaces by access point only: a
# directory left without one isn't visible without mounting the file
# system. Same proceed=true proof as the drain. See "cluster-down refuses:
# workspaces would be deleted" in docs/troubleshooting.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm.'
        required: true
        type: string
      force:
        description: "Stop any running pods before destroying."
        required: false
        default: false
        type: boolean
      delete_workspaces:
        description: "Delete the pod workspaces on EFS. Needed only when efs.retainOnClusterDown is false and workspaces exist."
        required: false
        default: false
        type: boolean

# cluster-up and cluster-down share one concurrency group (#225), so two
# cluster runs never overlap. cancel-in-progress: false never cancels a
# running run; GitHub keeps at most ONE pending run per group (a newer
# dispatch cancels an older waiting one). pod-up / pod-down are NOT in the
# group: they refuse to start while a cluster-down is queued or running, and
# cluster-down waits for running pod runs before it drains
# (.github/actions/teardown-lock). See "Pod and cluster runs" in
# docs/operating.md.
concurrency:
  group: cloud-dev-pods-cluster-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.repository != 'foolswithtools/cloud-dev-pods' && inputs.confirm == 'destroy'
    permissions:
      contents: read
    steps:
      - run: echo "Tearing down cluster in fork ${{ github.repository }}."

  destroy:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read  # teardown-lock lists pod-up / pod-down runs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stack names come from naming.prefix in config/config.yaml (#225), via
      # the same module the CDK app builds its stacks from.
      - name: Resolve stack names
        id: stacks
        env:
          CDPODS_CONFIG: ${{ github.workspace }}/config/config.yaml
        run: |
          set -euo pipefail
          CLUSTER_STACKS=$(npx tsx scripts/stack-names.ts --cluster)
          if [ -z "$CLUSTER_STACKS" ]; then
            echo "::error::scripts/stack-names.ts returned no stack names. Not destroying."
            exit 1
          fi
          echo "Cluster stacks: $CLUSTER_STACKS"
          echo "cluster=$CLUSTER_STACKS" >> "$GITHUB_OUTPUT"

      - name: Configure AWS via OIDC
        uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Fail before the drain stops any pod if none of the configured stacks
      # is deployed: a prefix that doesn't match what cluster-up deployed
      # would otherwise drain the pods and then "destroy" nothing, green.
      # A partial set (an earlier cluster-down that failed midway) is fine.
      - name: Require deployed stacks
        env:
          CLUSTER_STACKS: ${{ steps.stacks.outputs.cluster }}
        run: |
          set -euo pipefail
          read -ra stacks <<< "$CLUSTER_STACKS"
          found=()
          for s in "${stacks[@]}"; do
            if aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then
              found+=("$s")
            fi
          done
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::None of the configured stacks ($CLUSTER_STACKS) exists in CloudFormation. Check naming.prefix in config/config.yaml against the stacks cluster-up deployed. Not destroying."
            exit 1
          fi
          echo "Deployed: ${found[*]}"

      # pod-up / pod-down aren't in the concurrency group. They refuse to
      # start while this run is active; wait here for any that started
      # before it, so none lands between the drain and cdk destroy.
      - name: Wait for running pod workflows
        uses: ./.github/actions/teardown-lock
        with:
          mode: wait

      # Before the drain stops any pod, and after the lock so a pod-up can't
      # add a workspace behind the check. Exits non-zero unless the EFS
      # workspaces are retained, absent, or delete_workspaces=true. Writes
      # proceed=true, efs_action and efs_id to $GITHUB_OUTPUT only when it
      # is safe to destroy.
      - name: Pre-flight — check EFS workspaces
        id: workspace_guard
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CDPODS_CONFIG: ${{ github.workspace }}/config/config.yaml
          DELETE_WORKSPACES: ${{ inputs.delete_workspaces }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DELETE_WORKSPACES" = "true" ]; then
            args+=(--delete-workspaces)
          fi
          npx tsx scripts/cluster-workspace-guard.ts "${args[@]}"

      - name: Require workspace pre-flight proof
        if: steps.workspace_guard.outputs.proceed != 'true'
        run: |
          echo "::error::The workspace pre-flight exited 0 but did not write proceed=true, so it never confirmed the EFS workspaces are safe to destroy. Not destroying. See \"cluster-down refuses: workspaces would be deleted\" in docs/troubleshooting.md."
          exit 1

      - name: Pre-flight — check and drain pods
        id: drain
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          # Exits non-zero (failing the job before cdk destroy) unless no pods
          # remain registered. Writes its outcome to $GITHUB_STEP_SUMMARY, and
          # writes proceed=true to $GITHUB_OUTPUT only when it is safe to destroy.
          npx tsx scripts/cluster-drain.ts "${args[@]}"

      # Runs only when the drain step exited 0. Without the proceed=true marker
      # the drain never decided anything (e.g. main() did not run), so fail
      # the job rather than let a skipped destroy read as a green run.
      - name: Require pre-flight proof
        if: steps.drain.outputs.proceed != 'true'
        run: |
          echo "::error::The pod pre-flight exited 0 but did not write proceed=true, so it never confirmed the cluster is safe to destroy. Not destroying. See \"cluster-down refuses: pod pre-flight failed\" in docs/troubleshooting.md."
          exit 1

      - name: cdk destroy (everything except Bootstrap)
        if: steps.drain.outputs.proceed == 'true' && steps.workspace_guard.outputs.proceed == 'true'
        working-directory: infra
        env:
          CDPODS_CONFIG: ${{ github.workspace }}/config/config.yaml
          CLUSTER_STACKS: ${{ steps.stacks.outputs.cluster }}
        run: |
          set -euo pipefail
          read -ra stacks <<< "$CLUSTER_STACKS"
          # cdk destroy orders the stacks by dependency itself.
          npx cdk destroy "${stacks[@]}" --force

      - name: Summary
        env:
          EFS_ACTION: ${{ steps.workspace_guard.outputs.efs_action }}
          EFS_ID: ${{ steps.workspace_guard.outputs.efs_id }}
        run: |
          {
            echo "## Cluster destroyed"
            echo ""
            echo "Bootstrap (OIDC + IAM roles + ECR repos) retained. Re-run \`cluster-up.yml\` to spin everything back up."
            echo ""
            case "$EFS_ACTION" in
              retain)
                echo "**EFS: retained.** File system \`$EFS_ID\` and every \`/workspace\` on it were kept (\`efs.retainOnClusterDown: true\`, ADR 0007). Its storage is still billed (about \$0.30/GB-month) until you delete it. See docs/teardown.md."
                ;;
              destroy)
                echo "**EFS: deleted.** File system \`${EFS_ID:-unknown}\` was destroyed with the cluster (removal policy DESTROY, ADR 0007). Any \`/workspace\` data on it is gone."
                echo ""
                echo "To keep workspaces next time, set \`efs.retainOnClusterDown: true\` in \`config/config.yaml\` and run \`cluster-up.yml\` BEFORE \`cluster-down\`."
                ;;
              *)
                echo "**EFS: none.** The Cluster stack had no EFS file system left to delete."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
