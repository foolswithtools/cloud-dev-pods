name: cluster-down
# Tear down the cluster + cluster-supporting stacks. BootstrapStack (OIDC, IAM
# roles, ECR repos) is intentionally NOT destroyed — keep them around so you
# don't have to re-bootstrap if you spin the cluster back up later.
#
# Pre-flight: scripts/cluster-drain.ts (step id `drain`) decides whether
# `cdk destroy` may run. It refuses if any pods are registered, unless
# `force=true` (then it stops each one through the pod-manager Lambda and
# re-lists to confirm none are left). It fails closed: a failed pod list, a
# malformed response, a failed `down`, or a pod still registered after the
# drain all stop the teardown.
#
# Exit 0 alone is not enough: if the script's main() never runs, it still
# exits 0 (#194). So the drain writes the step output `proceed=true` only
# when it decided to proceed. `cdk destroy` runs only when
# `steps.drain.outputs.proceed == 'true'`, and the "Require pre-flight proof"
# step fails the job when the drain exited 0 without writing it (#211).
# See "cluster-down refuses: pod pre-flight failed" in docs/troubleshooting.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm.'
        required: true
        type: string
      force:
        description: "Stop any running pods before destroying."
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.repository != 'foolswithtools/cloud-dev-pods' && inputs.confirm == 'destroy'
    permissions:
      contents: read
    steps:
      - run: echo "Tearing down cluster in fork ${{ github.repository }}."

  destroy:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS via OIDC
        uses: ./.github/actions/aws-oidc
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pre-flight — check and drain pods
        id: drain
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          # Exits non-zero (failing the job before cdk destroy) unless no pods
          # remain registered. Writes its outcome to $GITHUB_STEP_SUMMARY, and
          # writes proceed=true to $GITHUB_OUTPUT only when it is safe to destroy.
          npx tsx scripts/cluster-drain.ts "${args[@]}"

      # Runs only when the drain step exited 0. Without the proceed=true marker
      # the drain never decided anything (e.g. main() did not run), so fail
      # the job rather than let a skipped destroy read as a green run.
      - name: Require pre-flight proof
        if: steps.drain.outputs.proceed != 'true'
        run: |
          echo "::error::The pod pre-flight exited 0 but did not write proceed=true, so it never confirmed the cluster is safe to destroy. Not destroying. See \"cluster-down refuses: pod pre-flight failed\" in docs/troubleshooting.md."
          exit 1

      - name: cdk destroy (everything except Bootstrap)
        if: steps.drain.outputs.proceed == 'true'
        working-directory: infra
        env:
          CDPODS_CONFIG: ${{ github.workspace }}/config/config.yaml
        run: |
          npx cdk destroy \
            CloudDevPods-IdleReaper \
            CloudDevPods-PodManager \
            CloudDevPods-PodTaskFamily \
            CloudDevPods-Cluster \
            CloudDevPods-Network \
            --force

      - name: Summary
        run: |
          {
            echo "## Cluster destroyed"
            echo ""
            echo "Bootstrap (OIDC + IAM roles + ECR repos) retained. Re-run \`cluster-up.yml\` to spin everything back up."
            echo ""
            echo "EFS filesystem was destroyed alongside the cluster (RemovalPolicy.DESTROY is the v0.2.0 default — see ADR 0007). Any \`/workspace\` data is gone."
            echo ""
            echo "If you want the v0.1.x retain-on-cluster-down behavior, set \`efs.retainOnClusterDown: true\` in your \`config/config.yaml\` and re-deploy via \`cluster-up.yml\` BEFORE running \`cluster-down\`."
          } >> "$GITHUB_STEP_SUMMARY"
