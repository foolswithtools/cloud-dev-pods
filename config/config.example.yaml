# Phase 4: copy to config/config.yaml (gitignored) and customize.
# Validated by infra/lib/config/schema.ts (Zod).
# Local secrets (GitHub OAuth client secret, cookie secret) are injected via
# AWS Secrets Manager, not this file.

project:
  name: cloud-dev-pods
  env: dev

aws:
  accountId: "123456789012"
  region: us-west-2

github:
  org: foolswithtools
  repo: cloud-dev-pods
  # DEPRECATED: use auth.browser.allowedOrg / auth.browser.allowedUsers below.
  # Still honored when auth.browser is absent; synth prints a deprecation
  # warning. GitHub org login that oauth2-proxy will allow into pod URLs.
  oauthAllowedOrg: foolswithtools

# Provider-neutral identity config (ADR 0008). Replaces github.oauthAllowed*.
# When auth.browser is set, the github.oauthAllowed* keys are ignored.
# Browser: providers "github" and "entra-id" are supported ("oidc" fails
# validation until the pluggable identity epic, #129, wires it). Entra ID
# setup, including the keys below, is in docs/setup-entra.md.
# Tunnel: github and microsoft (incl. Entra work/school) are both supported;
# pod-up's tunnel_provider input overrides it per pod.
# auth:
#   browser:
#     provider: github          # github | entra-id | oidc
#     allowedOrg: foolswithtools
#     allowedUsers: []          # GitHub logins, e.g. [alice, bob]
#     ownerOnly: false          # true: each browser pod admits only its owner + adminUsers
#     adminUsers: []            # break-glass access to every pod when ownerOnly is true
#     # entra-id only (requires domain.strategy: byo):
#     # issuerUrl: https://login.microsoftonline.com/<tenant-id>/v2.0
#     # allowedTenants: []      # tenant IDs; required with /common/, /organizations/, /consumers/
#     # allowedGroups: []       # group object IDs
#     # allowedEmailDomains: [] # e.g. [example.com]
#     # entraGroupOverage: false # true: request User.Read for users in > 200 groups
#   tunnel:
#     provider: github          # github | microsoft

domain:
  # "byo": bring your own Route53 hosted zone (recommended).
  # "alb-default": use ALB DNS + self-signed cert (non-prod).
  strategy: alb-default
  baseDomain: pods.example.com
  hostedZoneId: ZEXAMPLEZONEID

network:
  vpcCidr: "10.0.0.0/16"
  # 1 NAT (cheaper, single point of failure) or 2 NAT (HA, double cost).
  natGateways: 1
  # Set to true to add ECR / Secrets / Logs interface endpoints (saves NAT
  # data-transfer charges; adds ~$22/mo per endpoint per AZ).
  useVpcEndpoints: false

pods:
  defaultCpu: 1024
  defaultMemory: 2048
  spotPercentage: 100
  idleMinutes: 60

naming:
  prefix: CloudDevPods

efs:
  # When true, the EFS filesystem in ClusterStack is provisioned with
  # RemovalPolicy.RETAIN, so `cluster-down` leaves it (and any /workspace
  # data) behind. Default false sets RemovalPolicy.DESTROY — the filesystem
  # is destroyed with the cluster, avoiding orphan filesystems and the
  # name-collision footgun on the next `cluster-up`. Flip to `true` only if
  # this template is hosting data you genuinely cannot afford to lose on an
  # explicit `cluster-down`. See ADR 0007.
  retainOnClusterDown: false
