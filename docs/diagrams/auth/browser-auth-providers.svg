<text x="475.0" y="139.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">AUTH_BROWSER_* Lambda env vars</text>
<text x="475.0" y="154.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">(PodManager stack, cluster-up)</text>
</g>
