<text x="165.0" y="124.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">config.yaml auth.browser</text>
<text x="165.0" y="139.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">schema.ts: per-provider rules</text>
<text x="165.0" y="154.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">legacy github.oauthAllowed* mapped</text>
</g>
