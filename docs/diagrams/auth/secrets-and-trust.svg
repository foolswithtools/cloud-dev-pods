<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" data-quality-profile="standard">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker></defs>
<rect data-graph-role="background" width="1240" height="700" fill="#ffffff"/>
<text x="620.0" y="34" font-size="18" font-weight="600" fill="#111827" text-anchor="middle" data-graph-role="label">OAuth secrets and runtime trust</text>
<text x="620.0" y="54" font-size="12" fill="#6b7280" text-anchor="middle" data-graph-role="label">Who can assume which role, and who can read the /cloud-dev-pods/oauth/* secrets. Workflow-to-role mapping is out of scope here.</text>
<g id="oidc" data-graph-role="node" data-node-id="oidc">
<rect x="40" y="96" width="260" height="80" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="170.0" y="126.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">GitHub Actions OIDC</text>
<text x="170.0" y="141.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">token.actions.githubusercontent.com</text>
<text x="170.0" y="156.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">sub: main branch or env prod</text>
</g>
<g id="deployer" data-graph-role="node" data-node-id="deployer">
<rect x="700" y="96" width="240" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="820.0" y="126.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">CloudDevPodsDeployerRole</text>
<text x="820.0" y="141.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">PowerUser + iam:*, boundary</text>
<text x="820.0" y="156.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">bootstrap, cluster-up/down</text>
</g>
<g id="operator" data-graph-role="node" data-node-id="operator">
<rect x="1010" y="96" width="200" height="80" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1110.0" y="126.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Operator</text>
<text x="1110.0" y="141.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">aws CLI, after registering</text>
<text x="1110.0" y="156.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">the OAuth app</text>
</g>
<g id="podops" data-graph-role="node" data-node-id="podops">
<rect x="40" y="270" width="260" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="170.0" y="300.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">CloudDevPodsPodOpsRole</text>
<text x="170.0" y="315.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Invoke pod-manager, ECR push,</text>
<text x="170.0" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">logs:FilterLogEvents</text>
</g>
<g id="lambda" data-graph-role="node" data-node-id="lambda">
<rect x="360" y="270" width="240" height="80" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="480.0" y="300.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">pod-manager Lambda</text>
<text x="480.0" y="315.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">DescribeSecret only:</text>
<text x="480.0" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">never reads secret values</text>
</g>
<g id="secrets" data-graph-role="node" data-node-id="secrets">
<rect x="700" y="270" width="240" height="80" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="820.0" y="292.5" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Secrets Manager</text>
<text x="820.0" y="307.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">/cloud-dev-pods/oauth/</text>
<text x="820.0" y="322.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">client-id, client-secret,</text>
<text x="820.0" y="337.5" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">cookie-secret (generated)</text>
</g>
<g id="exec" data-graph-role="node" data-node-id="exec">
<rect x="1010" y="270" width="200" height="80" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="1110.0" y="300.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Task execution role</text>
<text x="1110.0" y="315.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">CloudDevPodsTaskExecutionRole</text>
<text x="1110.0" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">grantRead on 3 secrets</text>
</g>
<g id="taskroles" data-graph-role="node" data-node-id="taskroles">
<rect x="40" y="430" width="260" height="80" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="170.0" y="460.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Task roles (browser/tunnel/ssh)</text>
<text x="170.0" y="475.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">EFS ClientMount + ClientWrite</text>
<text x="170.0" y="490.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">no secrets, no logs</text>
</g>
<g id="sidecar" data-graph-role="node" data-node-id="sidecar">
<rect x="700" y="430" width="240" height="80" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="820.0" y="460.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">oauth2-proxy sidecar</text>
<text x="820.0" y="475.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">CLIENT_ID, CLIENT_SECRET,</text>
<text x="820.0" y="490.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">COOKIE_SECRET as env</text>
</g>
<g id="init" data-graph-role="node" data-node-id="init">
<rect x="700" y="590" width="240" height="74" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="820.0" y="617.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">owner-authz-init</text>
<text x="820.0" y="632.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">writes /authz/cookie-secret;</text>
<text x="820.0" y="647.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">shared cookie secret dropped</text>
</g>
<path id="e-oidc-deployer" data-graph-role="edge" data-edge-id="e-oidc-deployer" d="M 300.0 136.0 L 700.0 136.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<rect data-graph-role="decoration" x="428.0" y="117.0" width="144.0" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="500.0" y="128.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400" data-graph-role="label">AssumeRoleWithWebIdentity</text>
<path id="e-oidc-podops" data-graph-role="edge" data-edge-id="e-oidc-podops" d="M 170.0 176.0 L 170.0 270.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<rect data-graph-role="decoration" x="175.0" y="217.0" width="99.8" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="178.0" y="228.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="400" data-graph-role="label">same trust policy</text>
<path id="e-deployer-secrets" data-graph-role="edge" data-edge-id="e-deployer-secrets" d="M 820.0 176.0 L 820.0 270.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<rect data-graph-role="decoration" x="682.0" y="217.0" width="133.0" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="812.0" y="228.0" font-size="11" fill="#2563eb" text-anchor="end" font-weight="400" data-graph-role="label">deploys bootstrap stack</text>
<path id="e-operator-secrets" data-graph-role="edge" data-edge-id="e-operator-secrets" d="M 1110.0 176.0 L 1110.0 220.0 L 900.0 220.0 L 900.0 270.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<rect data-graph-role="decoration" x="919.2" y="201.0" width="171.6" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="1005.0" y="212.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="400" data-graph-role="label">update-secret client-id/secret</text>
<path id="e-podops-lambda" data-graph-role="edge" data-edge-id="e-podops-lambda" d="M 300.0 310.0 L 360.0 310.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<rect data-graph-role="decoration" x="310.4" y="291.0" width="39.1" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="330.0" y="302.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400" data-graph-role="label">Invoke</text>
<path id="e-lambda-secrets" data-graph-role="edge" data-edge-id="e-lambda-secrets" d="M 600.0 310.0 L 700.0 310.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
<rect data-graph-role="decoration" x="608.4" y="291.0" width="83.3" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="650.0" y="302.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" data-graph-role="label">DescribeSecret</text>
<path id="e-exec-secrets" data-graph-role="edge" data-edge-id="e-exec-secrets" d="M 1010.0 310.0 L 940.0 310.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<rect data-graph-role="decoration" x="961.0" y="291.0" width="28.1" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="975.0" y="302.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="400" data-graph-role="label">read</text>
<path id="e-lambda-taskroles" data-graph-role="edge" data-edge-id="e-lambda-taskroles" d="M 420.0 350.0 L 420.0 470.0 L 300.0 470.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<rect data-graph-role="decoration" x="323.9" y="451.0" width="72.2" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="360.0" y="462.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="400" data-graph-role="label">iam:PassRole</text>
<path id="e-lambda-sidecar" data-graph-role="edge" data-edge-id="e-lambda-sidecar" d="M 540.0 350.0 L 540.0 470.0 L 700.0 470.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
<rect data-graph-role="decoration" x="559.0" y="451.0" width="121.9" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="620.0" y="462.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400" data-graph-role="label">task def: secret ARNs</text>
<path id="e-exec-sidecar" data-graph-role="edge" data-edge-id="e-exec-sidecar" d="M 1110.0 350.0 L 1110.0 470.0 L 940.0 470.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<rect data-graph-role="decoration" x="964.0" y="451.0" width="121.9" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="1025.0" y="462.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="400" data-graph-role="label">injects at task start</text>
<path id="e-init-sidecar" data-graph-role="edge" data-edge-id="e-init-sidecar" d="M 820.0 590.0 L 820.0 510.0" fill="none" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
<rect data-graph-role="decoration" x="825.0" y="545.0" width="149.5" height="14" fill="#ffffff" fill-opacity="0.9"/>
<text x="828.0" y="556.0" font-size="11" fill="#9333ea" text-anchor="start" font-weight="400" data-graph-role="label">ownerOnly: per-task secret</text>
<g id="legend" data-graph-role="legend">
<line x1="48" y1="630" x2="78" y2="630" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<text x="86" y="634" font-size="12" fill="#6b7280" text-anchor="start">trust / invoke</text>
<line x1="193.16" y1="630" x2="223.16" y2="630" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<text x="231.16" y="634" font-size="12" fill="#6b7280" text-anchor="start">secret value</text>
<line x1="326.43999999999994" y1="630" x2="356.43999999999994" y2="630" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
<text x="364.43999999999994" y="634" font-size="12" fill="#6b7280" text-anchor="start">ARN / metadata only</text>
<line x1="501.29999999999995" y1="630" x2="531.3" y2="630" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrow-purple)"/>
<text x="539.3" y="634" font-size="12" fill="#6b7280" text-anchor="start">owner-only</text>
</g>
</svg>
