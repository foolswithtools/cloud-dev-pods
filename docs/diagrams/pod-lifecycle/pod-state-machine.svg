<path data-graph-role="edge" d="M 490.0,766.0 L 40.0,766.0 L 40.0,168.0 L 80.0,168.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<path data-graph-role="edge" d="M 710.0,766.0 L 1160.0,766.0 L 1160.0,168.0 L 1120.0,168.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<rect data-graph-role="node" x="80" y="130" width="220" height="76" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="190.0" y="158.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">No pod</text>
<text x="190.0" y="176.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">no registry row</text>
<text x="190.0" y="191.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">no access point</text>
<rect data-graph-role="node" x="490" y="130" width="220" height="76" rx="8" ry="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="600.0" y="158.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Starting</text>
<text x="600.0" y="176.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">AP, task def, TG + rule, task</text>
<text x="600.0" y="191.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">pending; no registry row yet</text>
<rect data-graph-role="node" x="900" y="130" width="220" height="76" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1010.0" y="158.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Workspace retained</text>
<text x="1010.0" y="176.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">no registry row</text>
<text x="1010.0" y="191.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">access point kept (Pod tag)</text>
<rect data-graph-role="node" x="490" y="330" width="220" height="76" rx="8" ry="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="600.0" y="358.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Running</text>
<text x="600.0" y="376.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">registry row, task RUNNING</text>
<text x="600.0" y="391.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">pod-up again: conflict</text>
<rect data-graph-role="node" x="900" y="330" width="220" height="76" rx="8" ry="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="1010.0" y="358.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Idle-warned</text>
<text x="1010.0" y="376.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">row.idleSince set, SNS sent</text>
<text x="1010.0" y="391.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">browser pods only</text>
<rect data-graph-role="node" x="80" y="530" width="220" height="76" rx="8" ry="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="190.0" y="558.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Orphaned</text>
<text x="190.0" y="576.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">registry row present</text>
<text x="190.0" y="591.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">task STOPPED</text>
<rect data-graph-role="node" x="490" y="730" width="220" height="76" rx="8" ry="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="600.0" y="758.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Stopping</text>
<text x="600.0" y="776.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">pod-manager down:</text>
<text x="600.0" y="791.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">task, rule, TG, row removed</text>
<text x="395.0" y="142.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">pod-up, new access point</text>
<text x="395.0" y="202.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">fails: rollback, AP deleted</text>
<text x="805.0" y="142.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">pod-up, reuse access point</text>
<text x="805.0" y="202.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">fails: rollback, AP kept</text>
<text x="610.0" y="258.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">task RUNNING,</text>
<text x="610.0" y="273.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">registry PutItem</text>
<text x="805.0" y="344.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">idle scan: 0 requests</text>
<text x="805.0" y="402.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">requests seen: clear</text>
<text x="200.0" y="452.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">task stops outside pod-down</text>
<text x="200.0" y="467.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">(crash, manual stop-task)</text>
<text x="310.0" y="540.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">ECS STOPPED event:</text>
<text x="310.0" y="555.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">reaper invokes down</text>
<text x="608.0" y="640.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">pod-down</text>
<text x="608.0" y="655.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">workflow</text>
<text x="850.0" y="462.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">still idle next scan: down</text>
<text x="56.0" y="758.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">[keepWorkspace=false] AP deleted</text>
<text x="726.0" y="758.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">[keepWorkspace=true] AP kept</text>
<g data-graph-role="legend" transform="translate(40,860)">
<line x1="0" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<text x="38" y="4" font-size="12" fill="#6b7280">workflow-triggered</text>
<line x1="184.96" y1="0" x2="214.96" y2="0" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<text x="222.96" y="4" font-size="12" fill="#6b7280">automatic (reaper / ECS)</text>
<line x1="410.24" y1="0" x2="440.24" y2="0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
<text x="448.24" y="4" font-size="12" fill="#6b7280">pod-up failure rollback</text>
<line x1="628.8" y1="0" x2="658.8" y2="0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<text x="666.8" y="4" font-size="12" fill="#6b7280">action completes</text>
<rect x="800.3199999999999" y="-8" width="30" height="16" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="838.3199999999999" y="4" font-size="12" fill="#6b7280">transient state</text>
</g>
