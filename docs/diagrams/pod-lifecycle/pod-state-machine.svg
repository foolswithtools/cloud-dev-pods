<path data-graph-role="edge" d="M 490.0,370.0 L 190.0,370.0 L 190.0,530.0" fill="none" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<path data-graph-role="edge" d="M 300.0,566.0 L 520.0,566.0 L 520.0,730.0" fill="none" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
